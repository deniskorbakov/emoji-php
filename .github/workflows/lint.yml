name: LINT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coding-standard:
    name: Coding Standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, gd

      - name: Install dependencies
        run: composer install --dev --no-progress --no-suggest --prefer-dist --no-interaction

      - name: Run PHPStan
        run: composer phpstan

      - name: Run CS
        run: composer cs

      - name: Run Rector
        run: composer rector
